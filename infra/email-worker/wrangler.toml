name = "kizuna-inbound-email"
main = "src/index.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# 受信メールの転送先（本番の受信Webhook）。
[vars]
INBOUND_WEBHOOK_URL = "https://kizuna-hp-yamato2.vercel.app/api/mail/inbound"

# MAIL_INBOUND_WEBHOOK_SECRET は secret として投入する:
#   npx wrangler secret put MAIL_INBOUND_WEBHOOK_SECRET
# （本番 Vercel の同名変数と一致させること）
